name: Build and commit TCM catalogue

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tcm-catalog-master
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test catalogue generator
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Generate catalogue
        run: python tools/build_siyuan_catalog.py --notebook-map catalog/notebook-map.json
      - name: Build human review queues
        run: python tools/build_siyuan_review_queue.py --documents catalog/generated/documents.csv --output catalog/generated --decisions catalog/review-decisions.csv
      - name: Build asset review queue from persisted local scan
        run: python tools/build_asset_review_queue.py --candidates catalog/local-review/asset-prefix-candidates-2026-11-05.csv --output catalog/generated --batch-size 25
      - name: Build bibliographic source review queue
        run: python tools/build_source_review_queue.py --candidates catalog/source-review-candidates.csv --output catalog/generated --batch-size 20
      - name: Validate generated catalogue consistency
        run: python tools/validate_siyuan_catalog.py --generated catalog/generated --source-candidates catalog/source-review-candidates.csv --asset-candidates catalog/local-review/asset-prefix-candidates-2026-11-05.csv
      - name: Commit generated catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/generated
          if git diff --cached --quiet; then
            echo 'Catalogue is unchanged.'
            exit 0
          fi
          git commit -m 'docs(catalog): refresh generated TCM index [skip ci]'
          # A concurrent master update or transient GitHub 5xx must not
          # discard the generated catalogue. Rebase and retry a bounded number
          # of times; never force-push.
          for attempt in 1 2 3; do
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Unable to publish generated catalogue after 3 attempts.' >&2
          exit 1
