name: Build and commit TCM catalogue

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tcm-catalog-master
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test catalogue generator
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Generate catalogue
        run: python tools/build_siyuan_catalog.py --notebook-map catalog/notebook-map.json
      - name: Audit real exported note text extraction coverage
        run: python tools/build_content_integrity_audit.py --output catalog/generated
      - name: Build typed-node semantic index
        run: python tools/build_node_semantic_index.py --output catalog/generated
      - name: Audit content anomalies across exported notes
        run: python tools/build_content_anomaly_audit.py --output catalog/generated
      - name: Extract dosage-expression review candidates
        run: python tools/build_dosage_expression_candidates.py --output catalog/generated
      - name: Build heading-level section index
        run: python tools/build_section_index.py --output catalog/generated
      - name: Export provenance-preserving machine-readable knowledge units
        run: python tools/build_knowledge_units.py --output catalog/generated
      - name: Validate machine-readable knowledge units
        run: python tools/build_knowledge_units.py --validate --output catalog/generated
      - name: Extract dictionary-backed entity mention candidates
        run: python tools/build_entity_mention_candidates.py --output catalog/generated
      - name: Validate entity mention candidate index
        run: python tools/build_entity_mention_candidates.py --validate --output catalog/generated
      - name: Build human review queues
        run: python tools/build_siyuan_review_queue.py --documents catalog/generated/documents.csv --output catalog/generated --decisions catalog/review-decisions.csv
      - name: Build topic and title extraction audits
        run: python tools/build_rule_extraction_audit.py --documents catalog/generated/documents.csv --output catalog/generated
      - name: Build asset review queue from persisted local scan
        run: python tools/build_asset_review_queue.py --candidates catalog/local-review/asset-prefix-candidates-2026-11-05.csv --output catalog/generated --batch-size 25
      - name: Build bibliographic source review queue
        run: python tools/build_source_review_queue.py --candidates catalog/source-review-candidates.csv --output catalog/generated --batch-size 20
      - name: Build human-review progress report
        run: python tools/build_review_progress_report.py --decisions catalog/review-decisions.csv --sources catalog/source-review-candidates.csv --assets catalog/generated/asset_review_queue.csv --evidence catalog/review-evidence.csv --topics catalog/generated/topic_rule_audit.csv --titles catalog/generated/title_extraction_audit.csv --empty-body catalog/generated/empty_body_review.csv --content-anomalies catalog/generated/content_anomaly_audit.csv --paragraph-anomalies catalog/generated/paragraph_anomaly_audit.csv --dosage-candidates catalog/generated/dosage_expression_candidates.csv --sections catalog/generated/section_index.csv --block-types catalog/generated/block_type_inventory.csv --output catalog/generated/review_progress.md
      - name: Validate generated catalogue consistency
        run: python tools/validate_siyuan_catalog.py --generated catalog/generated --source-candidates catalog/source-review-candidates.csv --asset-candidates catalog/local-review/asset-prefix-candidates-2026-11-05.csv
      - name: Validate human evidence ledger references
        run: python tools/validate_review_evidence.py --ledger catalog/review-evidence.csv && python tools/validate_review_evidence_references.py --ledger catalog/review-evidence.csv --decisions catalog/review-decisions.csv --sources catalog/source-review-candidates.csv --assets catalog/generated/asset_review_queue.csv
      - name: Commit generated catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/generated
          if git diff --cached --quiet; then
            echo 'Catalogue is unchanged.'
            exit 0
          fi
          git commit -m 'docs(catalog): refresh generated TCM index [skip ci]'
          # A concurrent master update or transient GitHub 5xx must not
          # discard the generated catalogue. Rebase and retry a bounded number
          # of times; never force-push.
          for attempt in 1 2 3; do
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Unable to publish generated catalogue after 3 attempts.' >&2
          exit 1
