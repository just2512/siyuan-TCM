name: Build and commit TCM catalogue

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Keep only the newest master source SHA in the full-corpus build queue.
  # The publish step below independently refuses to commit output from a stale source SHA.
  group: tcm-catalog-master-v3
  cancel-in-progress: true

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test catalogue generator
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Generate catalogue
        run: python tools/build_siyuan_catalog.py --notebook-map catalog/notebook-map.json
      - name: Audit real exported note text extraction coverage
        run: python tools/build_content_integrity_audit.py --output catalog/generated
      - name: Build typed-node semantic index
        run: python tools/build_node_semantic_index.py --output catalog/generated
      - name: Build independent semantic indexes in parallel
        shell: bash
        run: |
          set -uo pipefail
          python tools/build_content_anomaly_audit.py --output catalog/generated > "$RUNNER_TEMP/content-anomaly.log" 2>&1 & anomaly_pid=$!
          python tools/build_dosage_expression_candidates.py --output catalog/generated > "$RUNNER_TEMP/dosage-candidates.log" 2>&1 & dosage_pid=$!
          python tools/build_section_index.py --output catalog/generated > "$RUNNER_TEMP/section-index.log" 2>&1 & section_pid=$!
          python tools/build_knowledge_units.py --output catalog/generated > "$RUNNER_TEMP/knowledge-units.log" 2>&1 & units_pid=$!
          python tools/build_entity_mention_candidates.py --output catalog/generated > "$RUNNER_TEMP/entity-mentions.log" 2>&1 & mentions_pid=$!
          python tools/build_entity_registry.py --output catalog/generated/entity_registry.csv > "$RUNNER_TEMP/entity-registry.log" 2>&1 & registry_pid=$!
          status=0
          for pid in "$anomaly_pid" "$dosage_pid" "$section_pid" "$units_pid" "$mentions_pid" "$registry_pid"; do
            wait "$pid" || status=1
          done
          for log in "$RUNNER_TEMP/content-anomaly.log" "$RUNNER_TEMP/dosage-candidates.log" "$RUNNER_TEMP/section-index.log" "$RUNNER_TEMP/knowledge-units.log" "$RUNNER_TEMP/entity-mentions.log" "$RUNNER_TEMP/entity-registry.log"; do
            echo "::group::$(basename "$log")"
            cat "$log"
            echo "::endgroup::"
          done
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - name: Build corpus-derived unclassified term candidates
        run: python tools/build_unclassified_term_candidates.py | tee "$RUNNER_TEMP/unclassified-terms.log"
      - name: Classify corpus terms from exact source context
        run: python tools/build_contextual_term_candidates.py | tee "$RUNNER_TEMP/contextual-terms.log"
      - name: Validate knowledge units, entity mentions, and term candidates in parallel
        shell: bash
        run: |
          set -uo pipefail
          python tools/build_knowledge_units.py --validate --output catalog/generated > "$RUNNER_TEMP/validate-units.log" 2>&1 & units_pid=$!
          python tools/build_entity_mention_candidates.py --validate --output catalog/generated > "$RUNNER_TEMP/validate-mentions.log" 2>&1 & mentions_pid=$!
          python tools/build_entity_registry.py --validate --output catalog/generated/entity_registry.csv > "$RUNNER_TEMP/validate-registry.log" 2>&1 & registry_pid=$!
          python tools/build_unclassified_term_candidates.py --validate > "$RUNNER_TEMP/validate-terms.log" 2>&1 & terms_pid=$!
          python tools/build_contextual_term_candidates.py --validate > "$RUNNER_TEMP/validate-context-terms.log" 2>&1 & context_pid=$!
          status=0
          wait "$units_pid" || status=1
          wait "$mentions_pid" || status=1
          wait "$registry_pid" || status=1
          wait "$terms_pid" || status=1
          wait "$context_pid" || status=1
          cat "$RUNNER_TEMP/validate-units.log"
          cat "$RUNNER_TEMP/validate-mentions.log"
          cat "$RUNNER_TEMP/validate-registry.log"
          cat "$RUNNER_TEMP/validate-terms.log"
          cat "$RUNNER_TEMP/validate-context-terms.log"
          exit "$status"
      - name: Extract explicit formula-herb relation candidates
        run: python tools/build_formula_herb_relation_candidates.py
      - name: Validate formula-herb relation candidate provenance
        run: python tools/build_formula_herb_relation_candidates.py --validate
      - name: Cross-reference nested formula-herb mentions against relation endpoints
        run: python tools/audit_entity_mention_overlaps.py --mentions catalog/generated/entity_mention_candidates.csv.gz --relations catalog/generated/formula_herb_relation_candidates.csv --output catalog/generated/entity_mention_overlap_audit.json
      - name: Extract explicit symptom-syndrome-treatment-formula relation candidates
        run: python tools/build_contextual_relation_candidates.py
      - name: Validate contextual relation candidate provenance
        run: python tools/build_contextual_relation_candidates.py --validate
      - name: Audit contextual relation predicate coverage
        run: |
          set -o pipefail
          python tools/audit_contextual_relation_coverage.py | tee "$RUNNER_TEMP/contextual-relation-coverage.log"
      - name: Build SQLite full-text, entity and relation index
        run: python tools/build_siyuan_search_db.py --build --entity-mentions catalog/generated/entity_mention_candidates.csv.gz --relation-candidates catalog/generated/formula_herb_relation_candidates.csv --entity-registry catalog/generated/entity_registry.csv --term-candidates catalog/generated/unclassified_term_candidates.csv.gz --contextual-term-candidates catalog/generated/contextual_term_type_candidates.csv.gz --contextual-relations catalog/generated/contextual_relation_candidates.csv
      - name: Export machine-readable semantic graph
        run: python tools/export_semantic_graph.py
      - name: Validate semantic graph nodes and source evidence
        run: python tools/export_semantic_graph.py --validate
      - name: Smoke-test full-corpus SQLite query paths
        run: python tools/smoke_test_search_index.py --db catalog/generated/siyuan_search.sqlite3 --output catalog/generated/search_index_smoke.json
      - name: Publish queryable SQLite and semantic graph artifacts
        uses: actions/upload-artifact@v4
        with:
          name: siyuan-tcm-search-index
          path: |
            catalog/generated/siyuan_search.sqlite3
            catalog/generated/semantic_graph.jsonl.gz
            catalog/generated/contextual_term_type_candidates.csv.gz
            catalog/generated/contextual_relation_candidates.csv
            catalog/generated/contextual_relation_coverage.json
            catalog/generated/search_index_smoke.json
            catalog/generated/entity_mention_overlap_audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish full unclassified term candidate dataset
        uses: actions/upload-artifact@v4
        with:
          name: siyuan-tcm-unclassified-term-candidates
          path: catalog/generated/unclassified_term_candidates.csv.gz
          if-no-files-found: error
          retention-days: 30
      - name: Build independent review queues in parallel
        shell: bash
        run: |
          set -uo pipefail
          python tools/build_siyuan_review_queue.py --documents catalog/generated/documents.csv --output catalog/generated --decisions catalog/review-decisions.csv > "$RUNNER_TEMP/review-queue.log" 2>&1 & review_pid=$!
          python tools/build_rule_extraction_audit.py --documents catalog/generated/documents.csv --output catalog/generated > "$RUNNER_TEMP/rule-audit.log" 2>&1 & rule_pid=$!
          python tools/build_asset_review_queue.py --candidates catalog/local-review/asset-prefix-candidates-2026-11-05.csv --output catalog/generated --batch-size 25 > "$RUNNER_TEMP/asset-queue.log" 2>&1 & asset_pid=$!
          python tools/build_source_review_queue.py --candidates catalog/source-review-candidates.csv --output catalog/generated --batch-size 20 > "$RUNNER_TEMP/source-queue.log" 2>&1 & source_pid=$!
          status=0
          for pid in "$review_pid" "$rule_pid" "$asset_pid" "$source_pid"; do
            wait "$pid" || status=1
          done
          for log in "$RUNNER_TEMP/review-queue.log" "$RUNNER_TEMP/rule-audit.log" "$RUNNER_TEMP/asset-queue.log" "$RUNNER_TEMP/source-queue.log"; do
            echo "::group::$(basename "$log")"
            cat "$log"
            echo "::endgroup::"
          done
          exit "$status"
      - name: Build human-review progress report
        run: python tools/build_review_progress_report.py --decisions catalog/review-decisions.csv --sources catalog/source-review-candidates.csv --assets catalog/generated/asset_review_queue.csv --evidence catalog/review-evidence.csv --topics catalog/generated/topic_rule_audit.csv --titles catalog/generated/title_extraction_audit.csv --topic-review catalog/generated/topic_review.csv --title-review catalog/generated/title_review_candidates.csv --empty-body catalog/generated/empty_body_review.csv --content-anomalies catalog/generated/content_anomaly_audit.csv --paragraph-anomalies catalog/generated/paragraph_anomaly_audit.csv --dosage-candidates catalog/generated/dosage_expression_candidates.csv --sections catalog/generated/section_index.csv --block-types catalog/generated/block_type_inventory.csv --output catalog/generated/review_progress.md
      - name: Validate generated catalogue consistency
        run: python tools/validate_siyuan_catalog.py --generated catalog/generated --source-candidates catalog/source-review-candidates.csv --asset-candidates catalog/local-review/asset-prefix-candidates-2026-11-05.csv
      - name: Validate human evidence ledger references
        run: python tools/validate_review_evidence.py --ledger catalog/review-evidence.csv && python tools/validate_review_evidence_references.py --ledger catalog/review-evidence.csv --decisions catalog/review-decisions.csv --sources catalog/source-review-candidates.csv --assets catalog/generated/asset_review_queue.csv
      - name: Commit generated catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+just2512@users.noreply.github.com'
          git fetch origin master
          if [ "$(git rev-parse origin/master)" != "$GITHUB_SHA" ]; then
            echo "Skipping generated output from stale source SHA $GITHUB_SHA; master is $(git rev-parse origin/master)." >&2
            exit 0
          fi
          git add catalog/generated
          if git diff --cached --quiet; then
            echo 'Catalogue is unchanged.'
            exit 0
          fi
          git commit -m 'docs(catalog): refresh generated TCM index [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin master
            if [ "$(git rev-parse origin/master)" != "$GITHUB_SHA" ]; then
              echo "Skipping publish because master advanced beyond source SHA $GITHUB_SHA." >&2
              exit 0
            fi
            git rebase origin/master
            if git push origin HEAD:master; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Unable to publish generated catalogue after 3 attempts.' >&2
          exit 1
