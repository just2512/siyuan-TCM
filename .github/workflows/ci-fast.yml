name: Fast Python CI

on:
  push:
    branches:
      - 'work/**'
      - 'integration/**'
  pull_request:
    branches:
      - master
      - 'integration/**'
      - 'work/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcm-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q tools
      - name: Run unit tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v
